{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link
        rel="stylesheet"
        href="{% static 'css/register.css' %}">

</head>

<body>

    <!--=====================================
                BOTÓN REGRESAR
    ======================================-->

    <a
        href="{% url 'login' %}"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Regresar

    </a>


    <!--=====================================
                    MARCA
    ======================================-->

    <div class="brand">

        Cuervo-<span>Ride</span>

    </div>


    <!--=====================================
                FORMULARIO
    ======================================-->

    <div class="card">

        <h1>CREAR CUENTA</h1>


        <!--=================================
                MENSAJES DE DJANGO
        ==================================-->

        {% if messages %}

            <div class="messages-container">

                {% for message in messages %}

                    <div class="message {{ message.tags }}">

                        {{ message }}

                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form
            id="registerForm"
            method="POST"
            action="{% url 'register' %}"
            novalidate>

            {% csrf_token %}


            <!--=================================
                    DATOS PERSONALES
            ==================================-->

            <div class="form-section">

                <h2>Datos personales</h2>


                <!-- Nombre o nombres -->

                <div class="input-group">

                    <label for="nombre">
                        Nombre o nombres
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        maxlength="150"
                        autocomplete="given-name"
                        placeholder="Ingresa tu nombre o nombres"
                        value="{{ datos.nombre|default:'' }}"
                        required>

                </div>


                <!-- Apellido paterno -->

                <div class="input-group">

                    <label for="apellido_paterno">
                        Apellido paterno
                    </label>

                    <input
                        type="text"
                        id="apellido_paterno"
                        name="apellido_paterno"
                        maxlength="150"
                        autocomplete="family-name"
                        placeholder="Ingresa tu apellido paterno"
                        value="{{ datos.apellido_paterno|default:'' }}"
                        required>

                </div>


                <!-- Apellido materno -->

                <div class="input-group">

                    <label for="apellido_materno">
                        Apellido materno
                    </label>

                    <input
                        type="text"
                        id="apellido_materno"
                        name="apellido_materno"
                        maxlength="150"
                        autocomplete="additional-name"
                        placeholder="Ingresa tu apellido materno"
                        value="{{ datos.apellido_materno|default:'' }}">

                </div>

            </div>


            <!--=================================
                INFORMACIÓN ACADÉMICA
            ==================================-->

            <div class="form-section">

                <h2>Información académica</h2>


                <!-- Matrícula -->

                <div class="input-group">

                    <label for="matricula">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        name="matricula"
                        maxlength="20"
                        inputmode="numeric"
                        autocomplete="off"
                        placeholder="Ej. 1054323456"
                        value="{{ datos.matricula|default:'' }}"
                        required>

                </div>


                <!-- Carrera -->

                <div class="input-group">

                    <label for="carrera">
                        Carrera
                    </label>

                    <input
                        type="text"
                        id="carrera"
                        name="carrera"
                        maxlength="100"
                        autocomplete="organization-title"
                        placeholder="Ingresa tu carrera"
                        value="{{ datos.carrera|default:'' }}"
                        required>

                </div>


                <!-- Grado y grupo -->

                <div class="input-group">

                    <label for="grado_grupo">
                        Grado y grupo
                    </label>

                    <input
                        type="text"
                        id="grado_grupo"
                        name="grado_grupo"
                        maxlength="50"
                        autocomplete="off"
                        placeholder="Ej. 8A"
                        value="{{ datos.grado_grupo|default:'' }}"
                        required>

                </div>

            </div>


            <!--=================================
                    DATOS DE CONTACTO
            ==================================-->

            <div class="form-section">

                <h2>Datos de contacto</h2>


                <!-- Correo -->

                <div class="input-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="254"
                        autocomplete="email"
                        placeholder="ejemplo@ut-tijuana.edu.mx"
                        value="{{ datos.correo|default:'' }}"
                        required>

                </div>


                <!-- Teléfono -->

                <div class="input-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        maxlength="20"
                        autocomplete="tel"
                        inputmode="tel"
                        placeholder="Ingresa tu teléfono"
                        value="{{ datos.telefono|default:'' }}"
                        required>

                </div>

            </div>


            <!--=================================
                    CONTRASEÑA
            ==================================-->

            <div class="form-section">

                <h2>Seguridad</h2>


                <!-- Contraseña -->

                <div class="input-group password-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Mínimo 8 caracteres"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Mostrar contraseña">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- Confirmar contraseña -->

                <div class="input-group password-group">

                    <label for="confirmar_password">
                        Confirmar contraseña
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmar_password"
                            name="confirmar_password"
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Confirma tu contraseña"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="confirmar_password"
                            aria-label="Mostrar confirmación de contraseña">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>

            </div>


            <!--=================================
                        ROL
            ==================================-->

            <div class="form-section">

                <h2>Tipo de cuenta</h2>

                <p class="question">
                    ¿Cómo utilizarás Cuervo-Ride?
                </p>

                <div class="options">

                    <label
                        for="rolPasajero"
                        class="role-option">

                        <input
                            type="radio"
                            id="rolPasajero"
                            name="rol"
                            value="pasajero"

                            {% if datos.rol == "pasajero" or not datos.rol %}
                                checked
                            {% endif %}

                            required>

                        <span class="role-content">

                            <i class="fa-solid fa-user"></i>

                            <span>

                                <strong>
                                    Pasajero
                                </strong>

                                <small>
                                    Buscar y solicitar viajes
                                </small>

                            </span>

                        </span>

                    </label>


                    <label
                        for="rolConductor"
                        class="role-option">

                        <input
                            type="radio"
                            id="rolConductor"
                            name="rol"
                            value="conductor"

                            {% if datos.rol == "conductor" %}
                                checked
                            {% endif %}>

                        <span class="role-content">

                            <i class="fa-solid fa-car"></i>

                            <span>

                                <strong>
                                    Conductor
                                </strong>

                                <small>
                                    Publicar y administrar viajes
                                </small>

                            </span>

                        </span>

                    </label>

                </div>

            </div>


            <!--=================================
                    BOTÓN DE REGISTRO
            ==================================-->

            <button
                type="submit"
                class="create-btn">

                <i class="fa-solid fa-user-plus"></i>

                Crear cuenta

            </button>

        </form>

    </div>


    <!--=====================================
            MOSTRAR / OCULTAR CONTRASEÑA
    ======================================-->

    <script>

        document.querySelectorAll(
            ".toggle-password"
        ).forEach((button) => {

            button.addEventListener(
                "click",
                () => {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(
                            targetId
                        );

                    const icon =
                        button.querySelector("i");

                    if (input.type === "password") {

                        input.type = "text";

                        icon.classList.remove(
                            "fa-eye"
                        );

                        icon.classList.add(
                            "fa-eye-slash"
                        );

                        button.setAttribute(
                            "aria-label",
                            "Ocultar contraseña"
                        );

                    } else {

                        input.type = "password";

                        icon.classList.remove(
                            "fa-eye-slash"
                        );

                        icon.classList.add(
                            "fa-eye"
                        );

                        button.setAttribute(
                            "aria-label",
                            "Mostrar contraseña"
                        );

                    }

                }
            );

        });

    </script>

</body>

</html>
