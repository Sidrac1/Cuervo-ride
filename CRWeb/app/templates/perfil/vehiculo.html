

                            <form
                                method="POST"
                                enctype="multipart/form-data"
                                class="formulario"
                                id="formVehiculo">

                                {% csrf_token %}

                                <input
                                    type="hidden"
                                    name="tipo_formulario"
                                    value="vehiculo">


                                <!-- PROPIETARIO -->

                                <div class="campo">

                                    <label for="duenoVehiculo">
                                        Dueño del vehículo
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="text"
                                            id="duenoVehiculo"
                                            name="nombre_propietario"
                                            value="{{ vehiculo.nombre_propietario|default:'' }}"
                                            placeholder="Nombre completo del propietario"
                                            maxlength="150"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar propietario">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- MARCA -->

                                <div class="campo">

                                    <label for="marcaVehiculo">
                                        Marca
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="text"
                                            id="marcaVehiculo"
                                            name="marca"
                                            value="{{ vehiculo.marca|default:'' }}"
                                            placeholder="Ejemplo: Nissan"
                                            maxlength="80"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar marca">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- MODELO -->

                                <div class="campo">

                                    <label for="modeloVehiculo">
                                        Modelo
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="text"
                                            id="modeloVehiculo"
                                            name="modelo"
                                            value="{{ vehiculo.modelo|default:'' }}"
                                            placeholder="Ejemplo: Versa"
                                            maxlength="80"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar modelo">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- PLACAS -->

                                <div class="campo">

                                    <label for="placasVehiculo">
                                        Placas del vehículo
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="text"
                                            id="placasVehiculo"
                                            name="placas"
                                            value="{{ vehiculo.placas|default:'' }}"
                                            placeholder="Ejemplo: ABC-123"
                                            maxlength="20"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar placas">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- AÑO -->

                                <div class="campo">

                                    <label for="anioVehiculo">
                                        Año
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="number"
                                            id="anioVehiculo"
                                            name="anio"
                                            value="{{ vehiculo.anio|default:'' }}"
                                            placeholder="Ejemplo: 2022"
                                            min="1990"
                                            max="2100"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar año">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- COLOR -->

                                <div class="campo">

                                    <label for="colorVehiculo">
                                        Color
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="text"
                                            id="colorVehiculo"
                                            name="color"
                                            value="{{ vehiculo.color|default:'' }}"
                                            placeholder="Ejemplo: Blanco"
                                            maxlength="50"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar color">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- CAPACIDAD -->

                                <div class="campo">

                                    <label for="capacidadVehiculo">
                                        Capacidad de pasajeros
                                    </label>

                                    <div class="input-box">

                                        <input
                                            type="number"
                                            id="capacidadVehiculo"
                                            name="capacidad_pasajeros"
                                            value="{{ vehiculo.capacidad_pasajeros|default:'' }}"
                                            placeholder="Ejemplo: 4"
                                            min="1"
                                            max="8"
                                            readonly>

                                        <button
                                            type="button"
                                            class="editar"
                                            aria-label="Editar capacidad">

                                            <i class="fa-solid fa-pencil"></i>

                                        </button>

                                    </div>

                                </div>


                                <!-- FOTO DEL VEHÍCULO -->

                                <div class="campo">

                                    <label for="fotoVehiculo">
                                        Fotografía del vehículo
                                    </label>

                                    {% if vehiculo.foto_vehiculo %}

                                        <div class="archivo-actual">

                                            <a
                                                href="{{ vehiculo.foto_vehiculo.url }}"
                                                target="_blank"
                                                rel="noopener noreferrer">

                                                Ver fotografía actual

                                            </a>

                                        </div>

                                    {% endif %}

                                    <div class="input-box input-archivo">

                                        <input
                                            type="file"
                                            id="fotoVehiculo"
                                            name="foto_vehiculo"
                                            accept="image/png,image/jpeg,image/webp"
                                            disabled>

                                    </div>

                                </div>


                                <!-- TARJETA DE CIRCULACIÓN -->

                                <div class="campo">

                                    <label for="tarjetaCirculacion">
                                        Tarjeta de circulación
                                    </label>

                                    {% if vehiculo.tarjeta_circulacion %}

                                        <div class="archivo-actual">

                                            <a
                                                href="{{ vehiculo.tarjeta_circulacion.url }}"
                                                target="_blank"
                                                rel="noopener noreferrer">

                                                Ver archivo actual

                                            </a>

                                        </div>

                                    {% endif %}

                                    <div class="input-box input-archivo">

                                        <input
                                            type="file"
                                            id="tarjetaCirculacion"
                                            name="tarjeta_circulacion"
                                            accept="image/png,image/jpeg,image/webp,application/pdf"
                                            disabled>

                                    </div>

                                </div>


                                <!-- PÓLIZA DE SEGURO -->

                                <div class="campo">

                                    <label for="polizaSeguro">
                                        Póliza de seguro
                                    </label>

                                    {% if vehiculo.poliza_seguro %}

                                        <div class="archivo-actual">

                                            <a
                                                href="{{ vehiculo.poliza_seguro.url }}"
                                                target="_blank"
                                                rel="noopener noreferrer">

                                                Ver archivo actual

                                            </a>

                                        </div>

                                    {% endif %}

                                    <div class="input-box input-archivo">

                                        <input
                                            type="file"
                                            id="polizaSeguro"
                                            name="poliza_seguro"
                                            accept="image/png,image/jpeg,image/webp,application/pdf"
                                            disabled>

                                    </div>

                                </div>


                                <!-- BOTONES -->

                                <div class="botones oculto">

                                    <button
                                        type="button"
                                        class="cancelar">

                                        Cancelar

                                    </button>

                                    <button
                                        type="submit"
                                        class="guardar">

                                        Guardar

                                    </button>

                                </div>

                            </form>
