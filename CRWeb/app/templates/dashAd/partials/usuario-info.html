{% load static %}
<div class="usuario-card">
    <!--================ SIDEBAR =================-->
    <aside class="usuario-sidebar">
        <img id="fotoUsuario" src="{% static 'img/admin.png' %}" class="foto-usuario" alt="Usuario">
        <h2 id="nombreTitulo">Cargando...</h2>

        <button class="tab-btn active" id="btnGeneral">Información General</button>
        <button class="tab-btn" id="btnVerificacion" style="display:none;">Verificación de Conductor</button>
        <button class="tab-btn" id="btnMedico">Expediente Médico</button>
    </aside>

    <!--================ PANEL: INFORMACIÓN GENERAL =================-->
    <section class="usuario-panel" id="panelGeneral">
        <h2>Información General</h2>
        <form id="formGeneral">
            <input type="hidden" id="usuarioId">
            
            <div class="grid-info">
                <div class="campo">
                    <label>Nombre</label>
                    <input id="nombre" type="text" placeholder="Nombre">
                </div>

                <div class="campo">
                    <label>Correo Institucional</label>
                    <input id="correo" type="email" placeholder="Correo">
                </div>

                <div class="campo">
                    <label>Matrícula</label>
                    <input id="matricula" type="text" placeholder="Matrícula">
                </div>

                <div class="campo">
                    <label>Cuatrimestre / Grado</label>
                    <input id="cuatrimestre" type="text" placeholder="Grado y grupo">
                </div>

                <div class="campo">
                    <label>Carrera</label>
                    <input id="carrera" type="text" placeholder="Carrera">
                </div>

                <div class="campo">
                    <label>Rol</label>
                    <select id="rol">
                        <option value="administrador">Administrador</option>
                        <option value="conductor">Conductor</option>
                        <option value="pasajero">Pasajero</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Estado</label>
                    <select id="estado">
                        <option value="activa">Activa</option>
                        <option value="suspendida">Suspendida</option>
                        <option value="bloqueada">Bloqueada</option>
                        <option value="pendiente">Pendiente</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Contraseña (Dejar en blanco para no cambiar)</label>
                    <input id="password" type="password" placeholder="••••••••">
                </div>

                <div class="campo ancho">
                    <label>Teléfono</label>
                    <input id="telefono" type="text" placeholder="Teléfono">
                </div>
            </div>

            <div class="acciones-info">
                <button type="button" id="volver">Regresar</button>
                <button type="submit" id="guardar">Guardar Cambios</button>
            </div>
        </form>
    </section>

    <!--================ PANEL: VERIFICACIÓN (AGREGADO) =================-->
    <section class="usuario-panel" id="panelVerificacion" style="display: none;">
        <h2>Verificación de Conductor y Vehículo</h2>
        
        <!-- Aquí usuario-info.js inyectará la licencia y datos del vehículo -->
        <div id="verificacionContenido">
            <p>Cargando información de verificación...</p>
        </div>
    </section>
</div>
