{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuervo-Ride | Panel Administrador</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="{% static 'css/adminCSS/admin.css' %}">

    <!-- Flatpickr -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- CSS dinámico de cada vista -->
    <link rel="stylesheet" id="vista-css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ==========================================
                    HEADER
    =========================================== -->

    <header class="admin-header">

        <!-- Logo -->

        <div class="logo"
             id="btnInicio">

            <img src="{% static 'img/logo.png' %}" alt="Logo Cuervo-Ride">

            <h1>

                <span class="logo-cuervo">Cuervo</span><span class="logo-ride">-Ride</span>

            </h1>

        </div>

        <!-- Menú -->

        <nav class="menu-admin">

            <button class="menu-btn" data-view="usuarios">

                <span>Usuarios</span>
                <span>Registrados</span>

            </button>

            <button class="menu-btn" data-view="rides">

                <span>Rides</span>
                <span>Activos</span>

            </button>

            <button class="menu-btn" data-view="alertas">

                <span>Alertas</span>
                <span>Activas</span>

            </button>

            <button class="menu-btn" data-view="puntuacion">

                <span>Puntuación</span>
                <span>Promedio</span>

            </button>

        </nav>

        <!-- Perfil -->

        <div class="perfil">

            <img src="../static/img/profileIcon.png" alt="Administrador">

        </div>

    </header>

    <div class="header-line"></div>

    <!-- ==========================================
                CONTENIDO DINÁMICO
    =========================================== -->

    <main id="contenido">

        <!-- Aquí se cargan las vistas -->

    </main>

    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- JavaScript -->
    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/admin.js' %}"></script>

</body>

</html>
